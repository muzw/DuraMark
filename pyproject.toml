[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duramark"
version = "0.1.0"
description = "Duration-based audio watermarking for speech synthesis"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "DuraMark Contributors"}
]
keywords = ["watermark", "audio", "speech-synthesis", "tts", "speech-watermarking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "conformer==0.3.2",
    "diffusers==0.27.2",
    "gdown>=5.1.0",
    "gradio>=4.0",
    "grpcio>=1.57.0",
    "grpcio-tools>=1.57.0",
    "huggingface-hub>=0.23.0",
    "hydra-core>=1.3.0",
    "HyperPyYAML>=1.2.0",
    "inflect>=7.3.0",
    "librosa>=0.10.0",
    "matcha-tts>=0.1.0",
    "matplotlib>=3.7.0",
    "modelscope>=1.15.0",
    "networkx>=3.1",
    "numba>=0.58.0",
    "omegaconf>=2.3.0",
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0",
    "openai-whisper>=20231117",
    "protobuf>=4.25",
    "pydantic>=2.7.0",
    "regex",
    "rich>=13.7.0",
    "scikit-learn>=1.0",
    "scipy>=1.10",
    "soundfile>=0.12.0",
    "transformers>=4.40.0",
    "uvicorn>=0.30.0",
    "wget>=3.2",
    "cn2an>=0.5.0",
]

[project.scripts]
duramark = "duramark.cli.main:main"

[project.urls]
Homepage = "https://github.com/DuraMark/DuraMark"
Repository = "https://github.com/DuraMark/DuraMark"
Issues = "https://github.com/DuraMark/DuraMark/issues"

[tool.setuptools.packages.find]
include = ["duramark*"]
